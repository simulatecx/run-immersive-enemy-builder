<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Barlow+Condensed:wght@600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:800px; height:800px; overflow:hidden; background:#0a0705; }
.stage {
  position:relative; width:800px; height:800px; overflow:hidden;
  background:
    radial-gradient(42% 42% at 50% 46%, rgba(255,150,60,0.34), rgba(255,90,30,0.10) 44%, transparent 66%),
    radial-gradient(60% 60% at 50% 54%, rgba(200,36,18,0.30), transparent 62%),
    linear-gradient(150deg, #1a0d08 0%, #120907 48%, #0a0504 100%);
}
.stage::after { content:""; position:absolute; inset:0;
  box-shadow: inset 0 0 180px 50px rgba(0,0,0,0.75); }
.ember { position:absolute; border-radius:50%;
  background:radial-gradient(circle,#ffd27a,#ff7a2a 45%,rgba(255,80,20,0) 70%); }
.ring { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); }
.center { position:absolute; inset:0; z-index:3;
  display:flex; flex-direction:column; align-items:center; justify-content:center; }
.word { font-family:'Cinzel',serif; font-weight:900; font-size:220px; line-height:0.8;
  letter-spacing:3px;
  background:linear-gradient(176deg,#ffe7b0,#ffb24d 36%,#ff6a24 64%,#c81c12 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter: drop-shadow(0 5px 2px rgba(0,0,0,0.6)) drop-shadow(0 0 40px rgba(255,70,24,0.6)); }
.sub { margin-top:14px; font-family:'Barlow Condensed',sans-serif; font-weight:600;
  font-size:34px; letter-spacing:10px; text-transform:uppercase; color:#f1d9b4;
  text-shadow:0 2px 10px rgba(0,0,0,0.8); }
.sub b { color:#ff7a34; }
.tag { position:absolute; bottom:70px; left:0; right:0; text-align:center; z-index:4;
  font-family:'Cinzel',serif; font-style:italic; font-weight:700; font-size:27px;
  letter-spacing:2px; color:#e9b27a; text-shadow:0 2px 14px rgba(255,90,30,0.5); }
</style>
</head>
<body>
<div class="stage">
  <div class="ember" style="left:28%; top:72%; width:10px; height:10px; opacity:.85"></div>
  <div class="ember" style="left:66%; top:76%; width:7px; height:7px; opacity:.8"></div>
  <div class="ember" style="left:20%; top:50%; width:12px; height:12px; opacity:.5"></div>
  <div class="ember" style="left:74%; top:40%; width:6px; height:6px; opacity:.7"></div>
  <div class="ember" style="left:40%; top:80%; width:8px; height:8px; opacity:.6"></div>
  <div class="ember" style="left:58%; top:30%; width:5px; height:5px; opacity:.6"></div>

  <svg class="ring" width="560" height="560" viewBox="0 0 560 560" fill="none">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="56%" stop-color="rgba(255,96,32,0)"/>
        <stop offset="82%" stop-color="rgba(255,96,32,0.5)"/>
        <stop offset="100%" stop-color="rgba(255,96,32,0)"/>
      </radialGradient>
      <filter id="rb"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <circle cx="280" cy="280" r="210" fill="url(#glow)"/>
    <circle cx="280" cy="280" r="206" stroke="#ff6a2a" stroke-width="3" filter="url(#rb)" opacity="0.9"/>
    <g fill="#ffd27a">
      <circle cx="280" cy="62"  r="5"/><circle cx="280" cy="498" r="5"/>
      <circle cx="62"  cy="280" r="5"/><circle cx="498" cy="280" r="5"/>
    </g>
  </svg>

  <div class="center">
    <div class="word">RUN</div>
    <div class="sub">Immersive&nbsp;<b>Enemy</b>&nbsp;Builder</div>
  </div>
  <div class="tag">Your enemies remember.</div>
</div>
</body>
</html>
